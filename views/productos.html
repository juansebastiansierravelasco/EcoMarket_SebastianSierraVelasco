<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | EcoMarket</title>
    <meta name="description" content="Descubre productos sostenibles para tu hogar y tu vida diaria.">

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="site-header">
        <div class="container header-content">

            <a class="logo" href="index.html" aria-label="EcoMarket, inicio">
                <span class="logo-icon" aria-hidden="true">♻</span>
                <span>EcoMarket</span>
            </a>

            <nav class="main-nav" aria-label="Navegación principal">
                <a class="nav-link " href="index.html">Inicio</a>
                <a class="nav-link active" href="views/productos.html">Productos</a>
                <a class="nav-link" href="views/sobre-nosotros.html">Nosotros</a>
                <a class="nav-link" href="views/contacto.html">Contacto</a>
            </nav>

            <div class="header-actions">
                <a class="header-action" href="views/productos.html#buscador"
                   aria-label="Buscar productos" title="Buscar productos">
                    <span aria-hidden="true"> ⌕ </span>
                </a>

                <a class="header-action" href="views/productos.html"
                   aria-label="Ver catálogo" title="Ver catálogo">
                    <span aria-hidden="true">🛒</span>
                </a>
            </div>

        </div>
    </header>

<!--Buscador y Categorias-->
    <main class="container">
        <section class="catalogo">
            <h1>Nuestros Productos</h1>
            <p>Encuentra productos sosenibles para tu dia a dia</p>
        <form class="buscador" action="#" method="get" >
            <label for="buscar-producto">Buscador productos</label>

            <input
            type="search"
            id="buscar-producto"
            name="buscar"
            placeholder="Ej. botella reutilizable"
            >
            <button type="submit">Buscar</button>
        </form>
        </section>

        
<div class="catalogo-contenido">

    <aside class="filtros">
        <h2>Filtrar productos</h2>

        <fieldset>
            <legend>Categorías</legend>

            <label>
                <input type="checkbox" name="categoria" value="hogar">
                Hogar
            </label>

            <label>
                <input type="checkbox" name="categoria" value="moda">
                Moda
            </label>

            <label>
                <input type="checkbox" name="categoria" value="cuidado-personal">
                Cuidado personal
            </label>

            <label>
                <input type="checkbox" name="categoria" value="alimentos">
                Alimentos
            </label>
        </fieldset>

    </aside>

</div>


    


    </main>

</body>
</html>
